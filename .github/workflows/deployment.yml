name: Build_Curl_GC

on: 
  push:
    branches:
      - main

permissions: {}

jobs:
  build-and-curl:
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: docker-build 
        run: |
          docker build -t pipeline-test .
      - name: docker-run 
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          docker run -d -p 8000:8000 -e DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" pipeline-test
          
      - name: curl-ftw
        run: |
          sleep 10
          curl -f http://localhost:8000/

  sbom-scan-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: sbom_gen_and_scan
        uses: ./.github/actions/sbom-scan

      - name: upload_sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-sbom
          path: sbom.json
          compression-level: 0

  terraform-stage1:
    needs: [build-and-curl, sbom-scan-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ef5d4d6ba1ada42e3796ab0e3d231de2b1216d25
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: terraform-stage-1
        uses: ./.github/actions/terraform
        with:
          STATE_KEY: 'khaiwah'
          TF_STAGE: 'stage1'

  build-tag-push:
    needs: terraform-stage1
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: GAR Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: us-east1-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_CREDENTIALS }}

      - name: docker_build_tag_push
        run: |
          docker build -t final-django-app-repo .
          docker tag final-django-app-repo us-east1-docker.pkg.dev/devopalt/khaiwah-repo/final:latest
          docker push us-east1-docker.pkg.dev/devopalt/khaiwah-repo/final:latest

  terraform-stage-2:
    needs: build-tag-push
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@5a153479db58f878564756fc4de33be32c86b1fb
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: terraform-stage-2
        uses: ./.github/actions/terraform
        with:
          STATE_KEY: 'khaiwah'
          TF_STAGE: 'stage2'
          DJANGO_SECRET_KEY_PROD: ${{ secrets.DJANGO_SECRET_KEY }}

  pre-eval:
    needs: terraform-stage-2
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@5a153479db58f878564756fc4de33be32c86b1fb
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@60a4f5263795b8ee9e5bc531b7e63473f3fc3c4c
      - name: get_container_dns
        run: |
          echo "Waiting for service endpoint tracking configuration..."
          sleep 60
          SERVICE_URL=$(gcloud run services describe acmp-khaiwah-instance --platform managed --region us-east1 --format="value(status.url)")
          echo "Target live cloud url: $SERVICE_URL"
          
          AUTH_TOKEN=$(gcloud auth print-identity-token)
          
          echo "=== Executing Strict Network Health Audit ==="
          curl -f -H "Authorization: Bearer $AUTH_TOKEN" "$SERVICE_URL"
  
  terraform-stage-3:
    needs: pre-eval
    runs-on: ubuntu-latest
    steps:
      - name: get-code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
  
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@5a153479db58f878564756fc4de33be32c86b1fb
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
  
      - name: terraform-stage-3
        uses: ./.github/actions/terraform
        with:
          STATE_KEY: 'khaiwah'
          TF_STAGE: 'stage3'
